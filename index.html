function renderAccounting() {
  const bizDay = selectedBizDate || getDefaultBusinessDateStr();
  const month = selectedClosingMonth || bizDay.slice(0, 7);
  const year = month.slice(0, 4);
  const yearStart = `${year}-01-01`;

  const inScope = (recDateStr, scope) => {
    if (!recDateStr) return false;
    if (scope === 'day') return recDateStr === bizDay;
    if (scope === 'month') return recDateStr.startsWith(month);
    if (scope === 'year') return recDateStr.startsWith(year + '-');
    return true;
  };

  const sumOrders = (scope) => completedOrders.filter(x => inScope(x.dateStr, scope)).reduce((s, x) => s + Number(x.total || 0), 0);
  const sumExp = (scope) => expenses.filter(x => inScope(x.dateStr, scope)).reduce((s, x) => s + Number(x.amount || 0), 0);

  const todayRev = sumOrders('day');
  const todayCash = completedOrders.filter(x => x.dateStr === bizDay && x.payMethod === 'Cash').reduce((s, x) => s + Number(x.total || 0), 0);
  const todayQR = completedOrders.filter(x => x.dateStr === bizDay && x.payMethod === 'DuitNow QR').reduce((s, x) => s + Number(x.total || 0), 0);
  const todayExp = sumExp('day');
  const monthRev = sumOrders('month');
  const monthExp = sumExp('month');
  const yearRev = sumOrders('year');
  const yearExp = sumExp('year');

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card ${historyScope === 'day' ? 'active-period' : ''}" onclick="triggerHaptic(); setHistoryScope('day');">
      <div class="stat-title">${lang === 'zh' ? '营业日收入' : 'Biz Day Revenue'} (${formatDashDate(bizDay)})</div>
      <div class="stat-val" style="color:var(--price-color);">RM ${todayRev.toFixed(2)}</div>
      <div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">Cash: RM ${todayCash.toFixed(2)} | QR: RM ${todayQR.toFixed(2)}</div>
    </div>
    <div class="stat-card ${historyScope === 'day' ? 'active-period' : ''}" onclick="triggerHaptic(); setHistoryScope('day');">
      <div class="stat-title">${lang === 'zh' ? '营业日支出 / 净赚' : 'Biz Day Expense & Net'}</div>
      <div class="stat-val" style="color:#ef4444;">- RM ${todayExp.toFixed(2)}</div>
      <div style="font-size:0.84rem;font-weight:700;color:var(--primary);margin-top:4px;">${lang === 'zh' ? '净赚' : 'Net'}: RM ${(todayRev - todayExp).toFixed(2)}</div>
    </div>
    <div class="stat-card ${historyScope === 'month' ? 'active-period' : ''}" onclick="triggerHaptic(); setHistoryScope('month');">
      <div class="stat-title">${lang === 'zh' ? '所选月收入 / 净赚' : 'Month Revenue & Net'} (${month})</div>
      <div class="stat-val">RM ${monthRev.toFixed(2)}</div>
      <div style="font-size:0.84rem;font-weight:700;color:var(--price-color);margin-top:4px;">${lang === 'zh' ? '净赚' : 'Net'}: RM ${(monthRev - monthExp).toFixed(2)}</div>
    </div>
    <div class="stat-card ${historyScope === 'year' ? 'active-period' : ''}" onclick="triggerHaptic(); setHistoryScope('year');">
      <div class="stat-title">${lang === 'zh' ? '年度收入 / 净赚' : 'Year Revenue & Net'} (${year})</div>
      <div class="stat-val">RM ${yearRev.toFixed(2)}</div>
      <div style="font-size:0.84rem;font-weight:700;color:var(--price-color);margin-top:4px;">${lang === 'zh' ? '净赚' : 'Net'}: RM ${(yearRev - yearExp).toFixed(2)}</div>
    </div>
  `;

  const scopeTitleMap = {
    day: `${t('scopeLabelDay')} (${formatDashDate(bizDay)})`,
    month: `${t('scopeLabelMonth')} (${month})`,
    year: `${t('scopeLabelYear')} (${yearStart} - ${year}-12-31)`
  };
  document.getElementById('history-scope-label').textContent = scopeTitleMap[historyScope];

  const filteredOrders = completedOrders.map((ord, realIdx) => ({ ord, realIdx })).filter(({ ord }) => inScope(ord.dateStr, historyScope));
  const histEl = document.getElementById('paid-history-list');
  if (filteredOrders.length === 0) {
    histEl.innerHTML = `<div style="background:var(--notif-card);padding:12px;border-radius:14px;border:1px solid var(--glass-border);color:var(--muted);">${t('noPaidHist')}</div>`;
  } else {
    histEl.innerHTML = filteredOrders.map(({ ord, realIdx }) => `
      <div class="history-card">
        <div class="history-header" onclick="triggerHaptic(); toggleHistoryDetail(${realIdx});">
          <div>
            <b>${displayStoredTable(ord.table)}</b> · <span style="color:var(--muted);font-size:0.82rem;font-family:monospace;">${ord.id}</span>
            <span style="margin-left:8px;font-size:0.78rem;background:var(--tbl-btn-hover);color:var(--text);padding:2px 7px;border-radius:6px;font-weight:600;">${ord.payMethod}</span>
            <div style="font-size:0.78rem;color:var(--muted);margin-top:2px;">${lang === 'zh' ? '营业日' : 'Biz Day'}: ${formatDashDate(ord.dateStr || ord.paidAt)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="font-weight:700;color:var(--price-color);font-size:1rem;margin-right:4px;">RM ${Number(ord.total || 0).toFixed(2)}</span>
            <button class="mini-btn" onclick="openEditPaidOrderModal(${realIdx}, event)">${t('editPaidBtn')}</button>
            <button class="mini-btn" onclick="reopenPaidOrder(${realIdx}, event)">✏️ ${lang === 'zh' ? '改单重开' : 'Reopen'}</button>
            <button class="mini-btn" onclick="event.stopPropagation();triggerHaptic();printReceiptData(completedOrders[${realIdx}], 'Reprint')">${t('printBtn')}</button>
            <button class="mini-btn del" onclick="deletePaidOrder(${realIdx}, event)">${t('delBtn')}</button>
          </div>
        </div>
        <div class="history-detail" id="hist-detail-${realIdx}">
          ${ord.items.map(i => `
            <div style="display:flex;justify-content:space-between;padding:3px 0;">
              <span>${i.code} ${itemTitle(i)} ×${i.qty}</span>
              <span>RM ${(i.redeemed ? 0 : Number(i.subTotal || 0)).toFixed(2)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  const filteredExpenses = expenses.map((exp, realIdx) => ({ exp, realIdx })).filter(({ exp }) => inScope(exp.dateStr, historyScope));
  const expList = document.getElementById('expense-list');
  if (filteredExpenses.length === 0) {
    expList.innerHTML = `<div style="background:var(--notif-card);padding:12px;border-radius:14px;border:1px solid var(--glass-border);color:var(--muted);">${t('noExpHist')}</div>`;
  } else {
    expList.innerHTML = filteredExpenses.map(({ exp, realIdx }) => `
      <div class="history-card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <div>
          <b>[${formatExpCat(exp.cat)}]</b> ${exp.note || (lang === 'zh' ? '无备注' : 'No note')}
          <small style="color:var(--muted);margin-left:6px;font-family:monospace;">${formatDashDate(exp.dateStr || exp.dateTimeStr)}</small>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span style="font-weight:700;color:#ef4444;margin-right:2px;">- RM ${Number(exp.amount || 0).toFixed(2)}</span>
          <button class="mini-btn" onclick="triggerHaptic(); openEditExpenseModal(${realIdx});">${t('editExpBtn')}</button>
          <button class="mini-btn del" onclick="triggerHaptic(); deleteExpense(${realIdx});">${t('delBtn')}</button>
        </div>
      </div>
    `).join('');
  }
}

(function setupMidnightAutoRefresh() {
  const getTodayYmd = () => {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  let lastCalendarDay = getTodayYmd();

  setInterval(() => {
    const nowDay = getTodayYmd();
    if (nowDay !== lastCalendarDay) {
      lastCalendarDay = nowDay;
      selectedBizDate = nowDay;
      selectedClosingMonth = nowDay.slice(0, 7);
      localStorage.setItem('rainbow_biz_date', selectedBizDate);
      localStorage.setItem('rainbow_closing_month', selectedClosingMonth);
      const dayInput = document.getElementById('biz-day-input');
      const monthInput = document.getElementById('biz-month-input');
      if (dayInput) dayInput.value = selectedBizDate;
      if (monthInput) monthInput.value = selectedClosingMonth;
      if (typeof renderAccounting === 'function') renderAccounting();
      if (typeof renderPOS === 'function') renderPOS();
    }
  }, 15000);
})();

(function enableQuickTablePickerOnSubmit() {
  const originalSubmitOrder = window.submitOrder;
  if (typeof originalSubmitOrder !== 'function') return;

  let pickerSelectedTables = [];

  function ensureTablePickerModal() {
    let mask = document.getElementById('quick-table-picker-modal');
    if (mask) return mask;

    mask = document.createElement('div');
    mask.id = 'quick-table-picker-modal';
    mask.className = 'modal-mask';
    mask.innerHTML = `
      <div class="modal-box" style="max-width:440px;">
        <div class="modal-title" id="qtp-title"></div>
        <div class="modal-msg" id="qtp-subtitle" style="margin-bottom:10px;"></div>
        <div id="qtp-grid" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button type="button" class="mini-btn" style="padding:8px 14px;" id="qtp-cancel-btn"></button>
          <button type="button" class="mini-btn" style="background:var(--primary);color:#f8fafc;padding:8px 16px;" id="qtp-confirm-btn"></button>
        </div>
      </div>
    `;
    document.body.appendChild(mask);

    document.getElementById('qtp-cancel-btn').onclick = () => {
      pickerSelectedTables = [];
      closeModal('quick-table-picker-modal');
    };

    document.getElementById('qtp-confirm-btn').onclick = () => {
      if (!Array.isArray(pickerSelectedTables) || pickerSelectedTables.length === 0) return;

      selectedTables = [...pickerSelectedTables];
      const isTakeaway = typeof isTakeawayMode === 'function' ? isTakeawayMode() : selectedTables.includes('TAKEAWAY');
      if (Array.isArray(cart)) {
        cart.forEach(item => {
          if (item && item.mustPackFee) {
            item.packFee = isTakeaway ? 0.5 : 0;
          }
        });
      }
      if (typeof renderTables === 'function') renderTables();
      if (typeof renderCart === 'function') renderCart();

      closeModal('quick-table-picker-modal');
      pickerSelectedTables = [];
      originalSubmitOrder.call(window);
    };

    return mask;
  }

  function formatPickerBtnLabel(code) {
    if (code === 'TAKEAWAY') {
      return (typeof lang !== 'undefined' && lang === 'en') ? 'Takeaway' : '打包';
    }
    if (typeof formatTableLabel === 'function') {
      return formatTableLabel(code);
    }
    return (typeof lang !== 'undefined' && lang === 'en') ? `Table ${code}` : `${code}号`;
  }

  function renderPickerButtons() {
    const grid = document.getElementById('qtp-grid');
    if (!grid || typeof TABLES === 'undefined') return;

    grid.innerHTML = TABLES.map(code => {
      const isTakeaway = code === 'TAKEAWAY';
      const isSel = pickerSelectedTables.includes(code);
      const activeBg = isTakeaway
        ? 'background:linear-gradient(145deg,#eab308,var(--accent));color:#fffbeb;border-color:transparent;'
        : 'background:linear-gradient(145deg,#3b82f6,var(--primary-deep));color:#f8fafc;border-color:transparent;';
      const styleAttr = isSel ? activeBg : '';
      return `<button type="button" class="tbl-btn ${isTakeaway ? 'takeaway' : ''} ${isSel ? 'selected' : ''}" style="${styleAttr}" onclick="if(typeof triggerHaptic==='function')triggerHaptic(); window.__qtpToggle('${code}');">${formatPickerBtnLabel(code)}</button>`;
    }).join('');
  }

  window.__qtpToggle = function (code) {
    if (code === 'TAKEAWAY') {
      pickerSelectedTables = pickerSelectedTables.includes(code) ? [] : [code];
    } else {
      pickerSelectedTables = pickerSelectedTables.filter(x => x !== 'TAKEAWAY');
      if (pickerSelectedTables.includes(code)) {
        pickerSelectedTables = pickerSelectedTables.filter(x => x !== code);
      } else {
        pickerSelectedTables.push(code);
      }
    }
    renderPickerButtons();
  };

  function openQuickTablePicker() {
    const mask = ensureTablePickerModal();
    const isZh = typeof lang === 'undefined' || lang === 'zh';

    document.getElementById('qtp-title').textContent = isZh ? '🍽️ 尚未选择桌号，请直接选择' : '🍽️ Select Table to Send Order';
    document.getElementById('qtp-subtitle').textContent = isZh
      ? '选好桌号（或打包）后点“确定送出”，将直接送单并跳至第 2 页收银台。'
      : 'Pick table(s) or Takeaway, then tap Confirm to send and jump to POS.';
    document.getElementById('qtp-cancel-btn').textContent = typeof t === 'function' ? t('cancelBtn') : (isZh ? '取消' : 'Cancel');
    document.getElementById('qtp-confirm-btn').textContent = isZh ? '✅ 确定送出' : '✅ Confirm & Send';

    pickerSelectedTables = Array.isArray(selectedTables) ? [...selectedTables] : [];
    renderPickerButtons();
    mask.classList.add('show');
  }

  window.submitOrder = function (...args) {
    const noCart = !Array.isArray(cart) || cart.length === 0;
    const noTable = !Array.isArray(selectedTables) || selectedTables.length === 0;

    if (noCart) {
      return originalSubmitOrder.apply(this, args);
    }
    if (noTable) {
      openQuickTablePicker();
      return;
    }
    return originalSubmitOrder.apply(this, args);
  };
})();

(function setupMobileStickyOrderBar() {
  function ensureBar() {
    let bar = document.getElementById('mobile-sticky-order-bar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'mobile-sticky-order-bar';
      bar.innerHTML = `
        <div class="m-sticky-info">
          <span class="m-sticky-sub" id="m-sticky-sub"></span>
          <span class="m-sticky-total" id="m-sticky-total">RM 0.00</span>
        </div>
        <button type="button" class="m-sticky-btn" id="m-sticky-send-btn"></button>
      `;
      document.body.appendChild(bar);

      const btn = document.getElementById('m-sticky-send-btn');
      if (btn) {
        btn.onclick = () => {
          if (typeof triggerHaptic === 'function') triggerHaptic();
          if (typeof submitOrder === 'function') submitOrder();
        };
      }
    }
    return bar;
  }

  function syncBar() {
    const bar = ensureBar();
    const orderPage = document.getElementById('page-order');
    const isOrderActive = orderPage && orderPage.classList.contains('active');
    if (!isOrderActive) {
      bar.style.display = 'none';
      return;
    }
    bar.style.display = '';

    const isZh = typeof lang !== 'undefined' && lang === 'zh';
    const qtyCount = Array.isArray(cart)
      ? cart.reduce((sum, item) => sum + Number(item.qty || 1), 0)
      : 0;
    const totalVal = Array.isArray(cart)
      ? cart.reduce((sum, item) => sum + (typeof getCartItemRowTotal === 'function' ? Number(getCartItemRowTotal(item) || 0) : 0), 0)
      : 0;

    const tblText = (typeof selectedTables !== 'undefined' && Array.isArray(selectedTables) && selectedTables.length)
      ? selectedTables.join(' + ')
      : (isZh ? '未选桌号' : 'No Table');

    const subEl = document.getElementById('m-sticky-sub');
    const totEl = document.getElementById('m-sticky-total');
    const btnEl = document.getElementById('m-sticky-send-btn');

    if (subEl) {
      subEl.textContent = isZh
        ? `${tblText} · 已选 ${qtyCount} 项`
        : `${tblText} · ${qtyCount} item(s)`;
    }
    if (totEl) {
      totEl.textContent = `${isZh ? '合计' : 'Total'}: RM ${totalVal.toFixed(2)}`;
    }
    if (btnEl) {
      const isEditing = typeof editingActiveOrderIdx !== 'undefined' && editingActiveOrderIdx >= 0;
      btnEl.textContent = isEditing
        ? (isZh ? '✓ 保存修改' : '✓ Update Order')
        : (isZh ? '✓ 送出订单' : '✓ Send Order');
    }
  }

  const origRenderCart = window.renderCart;
  if (typeof origRenderCart === 'function') {
    window.renderCart = function (...args) {
      const res = origRenderCart.apply(this, args);
      syncBar();
      return res;
    };
  }

  const origSwitchPage = window.switchPage;
  if (typeof origSwitchPage === 'function') {
    window.switchPage = function (...args) {
      const res = origSwitchPage.apply(this, args);
      syncBar();
      return res;
    };
  }

  const origToggleTable = window.toggleTable;
  if (typeof origToggleTable === 'function') {
    window.toggleTable = function (...args) {
      const res = origToggleTable.apply(this, args);
      syncBar();
      return res;
    };
  }
  const origSetLanguage = window.setLanguage;
  if (typeof origSetLanguage === 'function') {
    window.setLanguage = function (...args) {
      const res = origSetLanguage.apply(this, args);
      syncBar();
      return res;
    };
  }
  window.addEventListener('resize', syncBar, { passive: true });
  requestAnimationFrame(syncBar);
})();

(function enhanceMobileOrderDrawer() {
  function formatMobileTableLabel() {
    const isZh = typeof lang === 'undefined' || lang === 'zh';
    if (!Array.isArray(selectedTables) || selectedTables.length === 0) {
      return isZh ? '未选桌号' : 'No Table';
    }
    if (selectedTables.includes('TAKEAWAY')) {
      return isZh ? '打包' : 'Takeaway';
    }
    return selectedTables
      .map(tbl => {
        const clean = String(tbl).replace(/号/g, '').replace(/Table/gi, '').trim();
        return isZh ? `桌号${clean}` : `Table ${clean}`;
      })
      .join(' + ');
  }

  function ensureDrawer() {
    let drawer = document.getElementById('m-cart-drawer');
    if (drawer) return drawer;

    drawer = document.createElement('div');
    drawer.id = 'm-cart-drawer';
    drawer.style.cssText = `
      position: fixed; left: 0; right: 0; bottom: 68px; z-index: 94;
      max-height: 62vh; display: none; flex-direction: column;
      background: var(--modal-bg); border-top: 1px solid var(--glass-border);
      border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.18);
      padding: 12px 14px 16px; overflow-y: auto;
      transform: translate3d(0, 24px, 0); opacity: 0;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    `;
    drawer.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--glass-line);">
        <span id="m-drawer-title" style="font-weight:700;font-size:0.95rem;"></span>
        <button type="button" id="m-drawer-close" class="mini-btn" style="padding:4px 10px;">✕</button>
      </div>
      <div id="m-drawer-list" style="display:flex;flex-direction:column;gap:8px;"></div>
    `;
    document.body.appendChild(drawer);

    document.getElementById('m-drawer-close').onclick = () => {
      drawer.style.transform = 'translate3d(0, 24px, 0)';
      drawer.style.opacity = '0';
      setTimeout(() => { drawer.style.display = 'none'; }, 200);
    };
    return drawer;
  }

  function renderDrawerItems() {
    const drawer = ensureDrawer();
    const listEl = document.getElementById('m-drawer-list');
    const titleEl = document.getElementById('m-drawer-title');
    if (!listEl || !titleEl) return;

    const isZh = typeof lang === 'undefined' || lang === 'zh';
    titleEl.textContent = `${formatMobileTableLabel()} · ${isZh ? '已点明细' : 'Order Items'}`;

    if (!Array.isArray(cart) || cart.length === 0) {
      listEl.innerHTML = `<div style="text-align:center;color:var(--muted);padding:14px 0;">${isZh ? '还没有选择任何菜品' : 'No items selected yet'}</div>`;
      return;
    }

    listEl.innerHTML = cart.map((item, idx) => {
      const rowTotal = (typeof getCartItemRowTotal === 'function')
        ? Number(getCartItemRowTotal(item) || 0)
        : Number(item.basePrice || 0) * Number(item.qty || 1);
      const notes = (typeof formatRedeemAndRemark === 'function') ? formatRedeemAndRemark(item) : [];
      const metaLine = [item.spec, ...notes].filter(Boolean).join(' · ');

      return `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--notif-card);border:1px solid var(--glass-border);">
          <div style="min-width:0;flex:1;">
            <div style="font-weight:700;font-size:0.9rem;">${item.code} ${typeof itemTitle === 'function' ? itemTitle(item) : item.cn} ×${item.qty}</div>
            ${metaLine ? `<div style="font-size:0.76rem;color:var(--accent);margin-top:2px;">${metaLine}</div>` : ''}
            <div style="font-size:0.82rem;font-weight:700;color:var(--price-color);margin-top:2px;">RM ${rowTotal.toFixed(2)}</div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0;">
            <button type="button" class="mini-btn" onclick="if(typeof triggerHaptic==='function')triggerHaptic(); openRemarkModal(${idx});">${isZh ? '备注' : 'Note'}</button>
            <button type="button" class="mini-btn del" style="margin-left:0;" onclick="if(typeof triggerHaptic==='function')triggerHaptic(); removeCartItem(${idx});">${isZh ? '删除' : 'Del'}</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleDrawer() {
    const drawer = ensureDrawer();
    const isOpen = drawer.style.display === 'flex';
    if (isOpen) {
      drawer.style.transform = 'translate3d(0, 24px, 0)';
      drawer.style.opacity = '0';
      setTimeout(() => { drawer.style.display = 'none'; }, 200);
    } else {
      renderDrawerItems();
      drawer.style.display = 'flex';
      requestAnimationFrame(() => {
        drawer.style.transform = 'translate3d(0, 0, 0)';
        drawer.style.opacity = '1';
      });
    }
  }

  function patchStickyBar() {
    const subEl = document.getElementById('m-sticky-sub');
    const infoEl = subEl ? subEl.parentElement : null;
    if (infoEl && !infoEl.dataset.drawerBound) {
      infoEl.dataset.drawerBound = '1';
      infoEl.style.cursor = 'pointer';
      infoEl.addEventListener('click', () => {
        if (typeof triggerHaptic === 'function') triggerHaptic();
        toggleDrawer();
      });
    }
    if (subEl) {
      const isZh = typeof lang === 'undefined' || lang === 'zh';
      const qtyCount = Array.isArray(cart) ? cart.reduce((s, i) => s + Number(i.qty || 1), 0) : 0;
      subEl.textContent = isZh
        ? `${formatMobileTableLabel()} · 已选 ${qtyCount} 项 ▴`
        : `${formatMobileTableLabel()} · ${qtyCount} item(s) ▴`;
    }
    const drawer = document.getElementById('m-cart-drawer');
    if (drawer && drawer.style.display === 'flex') {
      renderDrawerItems();
    }
  }

  const origRenderCart = window.renderCart;
  if (typeof origRenderCart === 'function') {
    window.renderCart = function (...args) {
      const res = origRenderCart.apply(this, args);
      patchStickyBar();
      return res;
    };
  }

  const origSwitchPage = window.switchPage;
  if (typeof origSwitchPage === 'function') {
    window.switchPage = function (...args) {
      const res = origSwitchPage.apply(this, args);
      const drawer = document.getElementById('m-cart-drawer');
      if (drawer) drawer.style.display = 'none';
      patchStickyBar();
      return res;
    };
  }

  requestAnimationFrame(patchStickyBar);
})();
init();
</script>
