<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#007aff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link id="pwa-manifest-link" rel="manifest" href="" />
  <title>Rainbow Ice Parlour & Coffee House Since 1991 - POS</title>
  <style>
    :root {
      --primary: #007aff;
      --primary-deep: #005ecb;
      --accent: #d97706;
      --bg-grad:
        radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.30), transparent 44%),
        radial-gradient(circle at 88% 16%, rgba(168, 85, 247, 0.18), transparent 42%),
        radial-gradient(circle at 50% 88%, rgba(45, 212, 191, 0.20), transparent 48%),
        linear-gradient(155deg, #d8e5f4 0%, #e8eff8 52%, #d9e6f5 100%);
      --header-bg: rgba(255, 255, 255, 0.56);
      --header-border: rgba(255, 255, 255, 0.78);
      --header-text: #0f172a;
      --notif-panel: rgba(255, 255, 255, 0.36);
      --table-bar-bg: rgba(255, 255, 255, 0.36);
      --tbl-btn-bg: rgba(255, 255, 255, 0.45);
      --tbl-btn-hover: rgba(255, 255, 255, 0.74);
      --notif-card: rgba(255, 255, 255, 0.48);
      --notif-card-hover: rgba(255, 255, 255, 0.76);
      --input-bg: rgba(255, 255, 255, 0.50);
      --input-focus-bg: rgba(255, 255, 255, 0.80);
      --modal-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.80);
      --glass-line: rgba(15, 23, 42, 0.08);
      --notif-shadow:
        0 10px 26px rgba(15, 23, 42, 0.08),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.92),
        inset 0 -1px 0 rgba(255, 255, 255, 0.35);
      --text: #162032;
      --muted: #526075;
      --price-color: #047857;
      --danger: #e11d48;
      --display-font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      --body-font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
    }

    body.dark-mode {
      --primary: #3b82f6;
      --primary-deep: #2563eb;
      --accent: #d99b38;
      --bg-grad:
        radial-gradient(circle at 14% 12%, rgba(59, 130, 246, 0.14), transparent 46%),
        radial-gradient(circle at 86% 18%, rgba(100, 116, 139, 0.14), transparent 45%),
        radial-gradient(circle at 60% 90%, rgba(20, 184, 166, 0.10), transparent 50%),
        linear-gradient(155deg, #14171d 0%, #1b1f27 52%, #13161c 100%);
      --header-bg: rgba(24, 28, 36, 0.78);
      --header-border: rgba(255, 255, 255, 0.13);
      --header-text: #d6dde6;
      --notif-panel: rgba(25, 29, 38, 0.56);
      --table-bar-bg: rgba(28, 33, 43, 0.56);
      --tbl-btn-bg: rgba(255, 255, 255, 0.06);
      --tbl-btn-hover: rgba(255, 255, 255, 0.12);
      --notif-card: rgba(255, 255, 255, 0.055);
      --notif-card-hover: rgba(255, 255, 255, 0.11);
      --input-bg: rgba(255, 255, 255, 0.06);
      --input-focus-bg: rgba(255, 255, 255, 0.11);
      --modal-bg: rgba(27, 31, 40, 0.92);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-line: rgba(255, 255, 255, 0.08);
      --notif-shadow:
        0 10px 26px rgba(0, 0, 0, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.25);
      --text: #d4dbe4;
      --muted: #8e99a8;
      --price-color: #34b38a;
    }

    * {
      box-sizing: border-box;
      font-family: var(--body-font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      background: var(--bg-grad);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.25s ease, color 0.2s ease;
    }

    #app-zoom-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .icon-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      font-size: 0.82rem;
      line-height: 1;
      flex-shrink: 0;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.22));
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: 0 3px 7px rgba(15, 23, 42, 0.14), inset 0 1px 1px rgba(255, 255, 255, 0.9);
    }
    body.dark-mode .icon-3d {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.04));
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .icon-3d-blue { background: linear-gradient(145deg, #60a5fa, #2563eb); color: #f8fafc; border-color: rgba(255, 255, 255, 0.45); }
    .icon-3d-amber { background: linear-gradient(145deg, #eab308, #b45309); color: #fffbeb; border-color: rgba(255, 255, 255, 0.45); }
    .icon-3d-green { background: linear-gradient(145deg, #34d399, #059669); color: #ecfdf5; border-color: rgba(255, 255, 255, 0.45); }

    header {
      background: var(--header-bg);
      backdrop-filter: blur(32px) saturate(185%);
      -webkit-backdrop-filter: blur(32px) saturate(185%);
      border-bottom: 1px solid var(--header-border);
      color: var(--header-text);
      padding: 9px 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      z-index: 20;
      transition: all 0.22s ease;
    }

    @media (max-width: 1220px) {
      header { display: flex; flex-wrap: wrap; justify-content: space-between; }
      .brand-wrap { order: -1; width: 100%; justify-content: center; }
    }

    /* 手机端滑动时自动收缩上方功能表 */
    @media (max-width: 900px) {
      header {
        padding: 6px 10px;
        gap: 6px;
      }
      header.header-scrolled .header-left,
      header.header-scrolled .brand-since,
      header.header-scrolled #settings-btn {
        display: none;
      }
      header.header-scrolled {
        padding: 5px 10px;
        flex-wrap: nowrap;
        gap: 6px;
      }
      header.header-scrolled .brand-wrap {
        order: 0;
        width: auto;
        justify-content: flex-start;
        gap: 5px;
      }
      header.header-scrolled .brand-title {
        font-size: 0.78rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 112px;
      }
      header.header-scrolled .header-right {
        flex: 1;
        justify-content: flex-end;
        flex-wrap: nowrap;
        gap: 4px;
      }
      header.header-scrolled .nav-tabs {
        flex-wrap: nowrap;
        gap: 3px;
        overflow-x: auto;
      }
      header.header-scrolled .nav-tab {
        padding: 4px 7px;
        font-size: 0.74rem;
        border-radius: 9px;
      }
      header.header-scrolled .nav-tab .icon-3d {
        display: none;
      }
    }

    .header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-self: start; }
    .brand-wrap { display: flex; align-items: center; justify-content: center; gap: 9px; user-select: none; text-align: center; justify-self: center; }
    .brand-home-link { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
    .wifi-led {
      width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.78);
    }
    .wifi-led.online { background: #06b6d4; box-shadow: 0 0 8px rgba(6, 182, 212, 0.85); }
    .wifi-led.offline { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.85); }
    .brand-title, .brand-since {
      font-family: var(--display-font); font-size: 1.02rem; font-weight: 700; letter-spacing: -0.02em; color: var(--header-text);
    }
    .header-right { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-self: end; }
    .live-clock {
      font-family: "SF Mono", ui-monospace, monospace; font-size: 0.82rem; font-weight: 600;
      background: var(--tbl-btn-bg); color: var(--text); padding: 6px 10px; border-radius: 12px; border: 1px solid var(--glass-border);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .glass-3d-btn, .nav-tab {
      background: var(--tbl-btn-bg); color: var(--text); border: 1px solid var(--glass-border);
      padding: 6px 11px; border-radius: 12px; font-size: 0.84rem; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-tab.active { background: linear-gradient(145deg, #3b82f6, var(--primary-deep)); color: #f8fafc; }
    .badge { background: linear-gradient(145deg, #f43f5e, var(--danger)); color: #fff; border-radius: 99px; padding: 1px 7px; font-size: 0.74rem; }

    .page { display: none; flex: 1; overflow: hidden; min-height: 0; }
    .page.active { display: flex; }

    .order-left { flex: 1; display: flex; flex-direction: column; padding: 12px; overflow: hidden; gap: 10px; min-width: 0; }
    .order-right {
      width: 400px; flex-shrink: 0; background: var(--notif-panel); backdrop-filter: blur(34px);
      border-left: 1px solid var(--glass-border); display: flex; flex-direction: column;
    }
    @media (max-width: 900px) {
      .page.active { flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .order-left { overflow: visible; padding: 10px; }
      .menu-container { overflow: visible !important; }
      .order-right { width: 100%; flex-shrink: 1; border-left: none; border-top: 1px solid var(--glass-border); }
    }

    .table-bar {
      background: var(--table-bar-bg); backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border); padding: 11px 14px; border-radius: 20px; box-shadow: var(--notif-shadow);
    }
    .table-bar-title { font-size: 0.88rem; color: var(--muted); font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .table-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .tbl-btn {
      padding: 8px 14px; border: 1px solid var(--glass-border); background: var(--tbl-btn-bg);
      border-radius: 14px; font-weight: 600; cursor: pointer; font-size: 0.92rem; min-height: 38px; color: var(--text);
    }
    .tbl-btn.selected { background: linear-gradient(145deg, #3b82f6, var(--primary-deep)); color: #f8fafc; }
    .tbl-btn.takeaway.selected { background: linear-gradient(145deg, #eab308, var(--accent)); color: #fffbeb; }

    .search-cat-bar { display: flex; flex-direction: column; gap: 8px; }
    .search-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .search-box {
      flex: 1; min-width: 180px; padding: 10px 14px; border: 1px solid var(--glass-border);
      background: var(--input-bg); border-radius: 15px; font-size: 0.95rem; outline: none; color: var(--text);
    }
    .layout-toggle { display: flex; gap: 4px; background: var(--table-bar-bg); border: 1px solid var(--glass-border); padding: 3px; border-radius: 13px; }
    .layout-btn { border: none; background: transparent; padding: 7px 11px; border-radius: 10px; font-size: 0.84rem; font-weight: 600; cursor: pointer; color: var(--muted); }
    .layout-btn.active { background: var(--notif-card-hover); color: var(--text); }

    .cat-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 3px; }
    .cat-btn {
      padding: 8px 15px; border: 1px solid var(--glass-border); background: var(--tbl-btn-bg);
      color: var(--text); border-radius: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; font-size: 0.92rem;
    }
    .cat-btn.active { background: linear-gradient(145deg, #3b82f6, var(--primary-deep)); color: #f8fafc; }

    .menu-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 4px; min-height: 0; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px; align-content: start; }
    .menu-column { display: flex; flex-direction: column; gap: 8px; }

    .menu-card {
      position: relative; background: var(--notif-card); backdrop-filter: blur(26px);
      border: 1px solid var(--glass-border); border-radius: 18px; padding: 10px;
      cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--notif-shadow);
    }
    .menu-card:active { transform: scale(0.97); }
    .food-thumb { width: 100%; height: 105px; object-fit: cover; border-radius: 12px; margin-bottom: 8px; }
    .food-thumb-placeholder {
      width: 100%; height: 64px; border-radius: 12px; margin-bottom: 8px;
      background: var(--tbl-btn-bg); color: var(--muted); display: flex; align-items: center; justify-content: center;
      font-size: 0.76rem; font-weight: 600; border: 1px dashed var(--glass-border);
    }
    .menu-column .menu-card { flex-direction: row; align-items: center; gap: 12px; padding: 9px 12px; }
    .menu-column .food-thumb, .menu-column .food-thumb-placeholder { width: 56px; height: 56px; margin-bottom: 0; flex-shrink: 0; }
    .menu-column .item-info { flex: 1; min-width: 0; }
    .menu-column .item-price { margin-top: 0; text-align: right; white-space: nowrap; }

    .item-code {
      font-size: 0.75rem; font-weight: 700; color: var(--text); background: var(--tbl-btn-hover);
      border: 1px solid var(--glass-border); padding: 2px 8px; border-radius: 8px; display: inline-block;
    }
    .item-name { font-weight: 600; font-size: 0.93rem; margin-top: 5px; line-height: 1.25; color: var(--text); }
    .item-price { font-weight: 700; color: var(--price-color); font-size: 0.9rem; margin-top: 6px; }

    .cart-header { padding: 12px 14px; border-bottom: 1px solid var(--glass-line); background: var(--tbl-btn-bg); display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cart-table-label { font-weight: 700; font-size: 1rem; color: var(--text); }
    .cart-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .cart-item { border: 1px solid var(--glass-border); border-radius: 16px; padding: 8px 10px; background: var(--notif-card); box-shadow: var(--notif-shadow); }
    .cart-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    .cart-item-name { font-weight: 600; font-size: 0.92rem; }
    .cart-item-sub { font-size: 0.76rem; color: var(--accent); margin-top: 2px; }
    .redeem-badge {
      display: inline-block; background: rgba(16, 185, 129, 0.18); color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.45); border-radius: 7px; padding: 1px 6px; font-size: 0.74rem; font-weight: 700; margin-top: 3px;
    }
    .cart-item-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; align-items: center; }
    .mini-btn {
      border: 1px solid var(--glass-border); background: var(--tbl-btn-bg); color: var(--text);
      padding: 4px 8px; border-radius: 9px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
    }
    .mini-btn.active { background: rgba(217, 155, 56, 0.22); border-color: var(--accent); color: var(--accent); }
    .mini-btn.del { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.42); color: #b91c1c; margin-left: auto; }
    body.dark-mode .mini-btn.del { color: #fca5a5; }
    .qty-box { display: flex; align-items: center; gap: 6px; }
    .qty-btn { width: 24px; height: 24px; border: 1px solid var(--glass-border); background: var(--tbl-btn-bg); color: var(--text); border-radius: 8px; font-weight: 700; cursor: pointer; }
    .cart-footer { padding: 12px 14px; border-top: 1px solid var(--glass-line); background: var(--tbl-btn-bg); }
    .total-row { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
    .btn-send {
      width: 100%; padding: 11px; background: linear-gradient(145deg, #10b981, #059669);
      color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 14px; font-size: 0.96rem; font-weight: 700; cursor: pointer;
    }

    .full-page { flex: 1; padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; max-width: 1200px; margin: 0 auto; width: 100%; }
    .toolbar-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .pos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
    .pos-column { display: flex; flex-direction: column; gap: 10px; }
    .order-card { background: var(--notif-card); backdrop-filter: blur(26px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 14px; box-shadow: var(--notif-shadow); }
    .pay-btns { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .pay-btn {
      flex: 1; min-width: 76px; padding: 8px 9px; border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px; font-weight: 700; color: #f8fafc; cursor: pointer; font-size: 0.84rem;
    }
    .pay-cash { background: linear-gradient(145deg, #10b981, #047857); }
    .pay-qr { background: linear-gradient(145deg, #3b82f6, #1d4ed8); }
    .pay-edit { background: linear-gradient(145deg, #f59e0b, #b45309); }
    .pay-print { background: linear-gradient(145deg, #64748b, #334155); }
    .pay-del { background: linear-gradient(145deg, #ef4444, #b91c1c); }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-card {
      background: var(--notif-card); backdrop-filter: blur(26px); padding: 15px; border-radius: 20px;
      border: 1px solid var(--glass-border); cursor: pointer; box-shadow: var(--notif-shadow);
    }
    .stat-card.active-period { border-color: var(--primary); }
    .stat-title { font-size: 0.84rem; color: var(--muted); }
    .stat-val { font-size: 1.4rem; font-weight: 700; margin-top: 6px; }

    .scope-bar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
      background: var(--notif-card); backdrop-filter: blur(24px); padding: 10px 14px;
      border-radius: 18px; border: 1px solid var(--glass-border); margin-bottom: 14px; box-shadow: var(--notif-shadow);
    }
    .scope-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .scope-btn {
      border: 1px solid var(--glass-border); background: var(--tbl-btn-bg); color: var(--text);
      padding: 6px 12px; border-radius: 11px; font-size: 0.84rem; font-weight: 600; cursor: pointer;
    }
    .scope-btn.active { background: linear-gradient(145deg, #3b82f6, var(--primary-deep)); color: #f8fafc; }

    .expense-form {
      background: var(--notif-card); backdrop-filter: blur(24px); padding: 14px; border-radius: 20px;
      border: 1px solid var(--glass-border); display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 18px; box-shadow: var(--notif-shadow);
    }
    .expense-form select, .expense-form input {
      padding: 8px 12px; border: 1px solid var(--glass-border); background: var(--input-bg);
      color: var(--text); border-radius: 12px; font-size: 0.9rem;
    }

    .history-card {
      background: var(--notif-card); backdrop-filter: blur(24px); border: 1px solid var(--glass-border);
      border-radius: 18px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--notif-shadow);
    }
    .history-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; cursor: pointer; }
    .history-detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--glass-line); display: none; font-size: 0.88rem; }
    .history-detail.open { display: block; }

    .modal-mask {
      position: fixed; inset: 0; background: rgba(10, 15, 28, 0.42);
      backdrop-filter: blur(14px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px;
    }
    .modal-mask.show { display: flex; }
    .modal-box {
      background: var(--modal-bg); backdrop-filter: blur(36px); border: 1px solid var(--glass-border);
      color: var(--text); border-radius: 24px; padding: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
    }
    .setting-section { background: var(--tbl-btn-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
    .setting-section-title { font-weight: 700; font-size: 0.92rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .setting-row-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .printer-status-box { font-size: 0.83rem; color: var(--muted); line-height: 1.45; margin-top: 8px; padding: 8px 10px; border-radius: 11px; background: var(--input-bg); border: 1px solid var(--glass-line); }

    .cash-modal-box { max-width: 540px; padding: 24px 24px 22px; border-radius: 26px; }
    .cash-modal-title { font-size: 1.24rem; font-weight: 700; margin-bottom: 14px; }
    .cash-summary-box { background: var(--tbl-btn-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
    .cash-given-input { width: 100% !important; font-size: 1.25rem !important; font-weight: 700 !important; padding: 12px 14px !important; border-radius: 14px !important; }
    .cash-change-preview { font-size: 1.28rem; font-weight: 700; color: var(--price-color); margin-top: 10px; min-height: 34px; }

:root {
  --ios-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --ios-snappy: cubic-bezier(0.2, 0.9, 0.3, 1);
}

.menu-card,
.order-card,
.history-card,
.stat-card {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background: var(--notif-card);
  contain: layout style paint;
  transform: translateZ(0);
  transition: transform 0.16s var(--ios-snappy), background-color 0.18s ease;
}

body:not(.dark-mode) .menu-card,
body:not(.dark-mode) .order-card,
body:not(.dark-mode) .history-card,
body:not(.dark-mode) .stat-card {
  background: rgba(255, 255, 255, 0.78);
}

body.dark-mode .menu-card,
body.dark-mode .order-card,
body.dark-mode .history-card,
body.dark-mode .stat-card {
  background: rgba(30, 35, 46, 0.84);
}

.menu-card {
  content-visibility: auto;
  contain-intrinsic-size: 165px;
}

.menu-column .menu-card {
  contain-intrinsic-size: 74px;
}

.history-card {
  content-visibility: auto;
  contain-intrinsic-size: 78px;
}

.tbl-btn,
.cat-btn,
.mini-btn,
.qty-btn,
.pay-btn,
.glass-3d-btn,
.nav-tab,
.layout-btn,
.scope-btn,
.tag-btn,
.cash-big-btn,
.btn-send {
  transition: transform 0.14s var(--ios-snappy), background-color 0.16s ease, opacity 0.16s ease;
}

.tbl-btn:active,
.cat-btn:active,
.mini-btn:active,
.qty-btn:active,
.pay-btn:active,
.glass-3d-btn:active,
.nav-tab:active,
.layout-btn:active,
.scope-btn:active,
.tag-btn:active,
.cash-big-btn:active,
.btn-send:active {
  transform: scale(0.95);
}

.modal-mask {
  backdrop-filter: blur(8px) !important;
  -webkit-backdrop-filter: blur(8px) !important;
  opacity: 0;
  transition: opacity 0.2s var(--ios-spring);
}

.modal-mask.show {
  opacity: 1;
}

.modal-box {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  transform: translate3d(0, 14px, 0) scale(0.97);
  transition: transform 0.24s var(--ios-spring);
}

body:not(.dark-mode) .modal-box {
  background: rgba(255, 255, 255, 0.96);
}

body.dark-mode .modal-box {
  background: rgba(26, 30, 40, 0.97);
}

.modal-mask.show .modal-box {
  transform: translate3d(0, 0, 0) scale(1);
}

.page.active {
  animation: iosPageFadeIn 0.2s var(--ios-spring);
}

@keyframes iosPageFadeIn {
  from { opacity: 0.72; transform: translate3d(0, 4px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}

.menu-container,
.cart-list,
.full-page,
.cat-tabs {
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

/* iOS 风格平滑收缩顶栏（仅针对顶栏容器本身，避免通配符全量重排） */
#main-header {
  transition: padding 0.26s var(--ios-spring), background-color 0.22s ease;
  will-change: padding;
}

@media (max-width: 768px) {
  #page-order.page.active {

  #mobile-sticky-order-bar {

    left: 0;
    right: 0;
    bottom: 0;
    z-index: 95;

    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));

    border-top: 1px solid rgba(15, 23, 42, 0.1);

  }

const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function setupPwaSupport() {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#007aff';
    ctx.fillRect(0, 0, 512, 512);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 170px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('POS', 256, 265);
    const iconPng = canvas.toDataURL('image/png');

    const manifest = {
      name: 'Rainbow Ice Parlour & Coffee House POS',
      short_name: 'Rainbow POS',
      start_url: './',
      scope: './',
      display: 'standalone',
      background_color: '#e8eff8',
      theme_color: '#007aff',
      icons: [
        { src: iconPng, sizes: '192x192', type: 'image/png' },
        { src: iconPng, sizes: '512x512', type: 'image/png' }
      ]
    };
    const mBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const mUrl = URL.createObjectURL(mBlob);
    const linkEl = document.getElementById('pwa-manifest-link');
    if (linkEl) linkEl.href = mUrl;

    if ('serviceWorker' in navigator && window.isSecureContext) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', event => {
          event.respondWith(fetch(event.request).catch(() => caches.match(event.request)));
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl, { scope: './' }).catch(() => {});
    }
  } catch (e) {}
}

function setupScrollAutoCollapseHeader() {
  const header = document.getElementById('main-header');
  if (!header) return;
  const scrollEls = [
    document.getElementById('page-order'),
    document.getElementById('menu-scroll-container'),
    document.getElementById('pos-scroll-container'),
    document.getElementById('account-scroll-container'),
    document.getElementById('menu-mgr-scroll-container')
  ].filter(Boolean);

  let ticking = false;
  let isCollapsed = false;

  const evaluateScroll = () => {
    ticking = false;
    if (window.innerWidth > 900) {
      if (isCollapsed) {
        isCollapsed = false;
        header.classList.remove('header-scrolled');
      }
      return;
    }
    let maxScroll = window.scrollY || document.documentElement.scrollTop || 0;
    for (let i = 0; i < scrollEls.length; i++) {
      const st = scrollEls[i].scrollTop || 0;
      if (st > maxScroll) maxScroll = st;
    }
    // 迟滞阈值防止临界点抖动
    if (!isCollapsed && maxScroll > 56) {
      isCollapsed = true;
      header.classList.add('header-scrolled');
    } else if (isCollapsed && maxScroll < 20) {
      isCollapsed = false;
      header.classList.remove('header-scrolled');
    }
  };

  const onScroll = () => {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(evaluateScroll);
    }
  };

  window.addEventListener('scroll', onScroll, { passive: true });
  scrollEls.forEach(el => el.addEventListener('scroll', onScroll, { passive: true }));
  window.addEventListener('resize', onScroll, { passive: true });
}

function formatDashDate(dateInput) {
  let d;
  if (!dateInput) {
    d = new Date();
  } else if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput)) {
    const [y, m, day] = dateInput.split('-').map(Number);
    d = new Date(y, m - 1, day);
  } else {
    d = new Date(dateInput);
  }
  if (isNaN(d.getTime())) return String(dateInput || '');
  const dayStr = String(d.getDate()).padStart(2, '0');
  const monStr = MONTHS_SHORT[d.getMonth()];
  return `${dayStr}-${monStr}-${d.getFullYear()}`;
}

function formatSpaceDate(dateInput) {
  return formatDashDate(dateInput).replace(/-/g, ' ');
}

function formatPrinted12h(d = new Date()) {
  const dayStr = String(d.getDate()).padStart(2, '0');
  const monStr = MONTHS_SHORT[d.getMonth()];
  let hr = d.getHours();
  const min = String(d.getMinutes()).padStart(2, '0');
  const ampm = hr >= 12 ? 'PM' : 'AM';
  hr = hr % 12;
  if (hr === 0) hr = 12;
  return `${dayStr}-${monStr}-${d.getFullYear()} ${String(hr).padStart(2, '0')}:${min} ${ampm}`;
}

const syncChannel = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('rainbow_pos_sync_v1') : null;
function broadcastMenuUpdate() {

      extraMenuItems = JSON.parse(localStorage.getItem('rainbow_extra_menu_items') || '[]');

      renderMenu();
      renderMenuManager();
    }
  };
}

let customMenuOverrides = JSON.parse(localStorage.getItem('rainbow_menu_overrides') || '{}');
let extraMenuItems = JSON.parse(localStorage.getItem('rainbow_extra_menu_items') || '[]');

let _cachedMergedMenu = null;
let _cachedMergedMenuByCode = null;
let _menuRenderTimer = null;
let _menuMgrRenderTimer = null;

function invalidateMenuCache() {
  _cachedMergedMenu = null;
  _cachedMergedMenuByCode = null;
}

function getMergedMenu() {
  if (_cachedMergedMenu) return _cachedMergedMenu;
  const mergedBase = BASE_MENU.map(item => {
    const ov = customMenuOverrides[item.code] || {};
    return {
      ...item,
      cn: ov.cn || item.cn,
      en: ov.en || item.en,
      price: (typeof ov.price === 'number' && !isNaN(ov.price)) ? ov.price : item.price,
      img: ov.img !== undefined ? ov.img : (item.img || '')
    };
  });
  _cachedMergedMenu = [...mergedBase, ...extraMenuItems];
  _cachedMergedMenuByCode = new Map(_cachedMergedMenu.map(m => [m.code, m]));
  return _cachedMergedMenu;
}

function getMenuItemByCode(code) {
  if (!_cachedMergedMenuByCode) getMergedMenu();
  return _cachedMergedMenuByCode.get(code);
}

function debouncedRenderMenu() {
  clearTimeout(_menuRenderTimer);
  _menuRenderTimer = setTimeout(() => {
    requestAnimationFrame(renderMenu);
  }, 90);
}

function debouncedRenderMenuManager() {
  clearTimeout(_menuMgrRenderTimer);
  _menuMgrRenderTimer = setTimeout(() => {
    requestAnimationFrame(renderMenuManager);
  }, 110);
}

function translateExpenseToEnglish(exp) {
  const catEn = EXP_ZH_TO_EN_MAP[exp.cat] || (EXP_CATS.find(c => c.zh === exp.cat)?.en) || exp.cat || 'Expense';
  const rawNote = String(exp.note || '').trim();
  if (!rawNote) return catEn;
  if (EXP_ZH_TO_EN_MAP[rawNote]) return EXP_ZH_TO_EN_MAP[rawNote];
  let converted = rawNote;
  Object.keys(EXP_ZH_TO_EN_MAP).sort((a, b) => b.length - a.length).forEach(zhKey => {
    if (converted.includes(zhKey)) converted = converted.split(zhKey).join(EXP_ZH_TO_EN_MAP[zhKey]);
  });
  return converted;
}

function getDefaultBusinessDateStr(d = new Date()) {
  const workDate = new Date(d.getTime());
  if (workDate.getHours() < 6) workDate.setDate(workDate.getDate() - 1);
  const pad = n => String(n).padStart(2, '0');
  return `${workDate.getFullYear()}-${pad(workDate.getMonth() + 1)}-${pad(workDate.getDate())}`;
}

function triggerHaptic(pattern = 12) {
  if (!hapticEnabled) return;
  try { if (navigator && typeof navigator.vibrate === 'function') navigator.vibrate(pattern); } catch (e) {}
}
function toggleHapticSetting() {
  hapticEnabled = !hapticEnabled;
  localStorage.setItem('rainbow_haptic_enabled', hapticEnabled ? 'on' : 'off');
  updateHapticBtnText();
  if (hapticEnabled) triggerHaptic(18);
}
function updateHapticBtnText() {
  const btn = document.getElementById('btn-haptic-toggle');
  if (!btn) return;
  btn.textContent = hapticEnabled ? t('hapticOn') : t('hapticOff');
  btn.classList.toggle('active', hapticEnabled);
}
function updateWifiStatus() {
  const led = document.getElementById('wifi-status-led');
  const isOnline = navigator.onLine !== false;
  if (led) { led.classList.toggle('online', isOnline); led.classList.toggle('offline', !isOnline); }
  const detailEl = document.getElementById('settings-wifi-detail');
  if (detailEl) detailEl.textContent = isOnline ? t('wifiOnlineDetail') : t('wifiOfflineDetail');
}
function goHomeOrderPage() {
  document.getElementById('main-header').classList.remove('header-scrolled');
  switchPage('order', document.getElementById('tab-order'));
}
function applyTheme() {
  document.body.classList.toggle('dark-mode', themeMode === 'dark');
  const iconEl = document.getElementById('theme-icon');
  const labelEl = document.getElementById('theme-label');
  if (iconEl && labelEl) {
    if (themeMode === 'dark') { iconEl.textContent = '☀️'; labelEl.textContent = 'Light'; }
    else { iconEl.textContent = '🌙'; labelEl.textContent = 'Dark'; }
  }
}
function toggleTheme() {
  themeMode = themeMode === 'dark' ? 'light' : 'dark';
  localStorage.setItem('rainbow_theme_mode', themeMode);
  applyTheme();
}
function applyZoom() {
  if (isNaN(uiZoom) || uiZoom < 80) uiZoom = 80;
  if (uiZoom > 150) uiZoom = 150;
  localStorage.setItem('rainbow_ui_zoom', String(uiZoom));
  const setZoomVal = document.getElementById('set-zoom-val');
  if (setZoomVal) setZoomVal.textContent = `${uiZoom}%`;
  document.getElementById('app-zoom-shell').style.zoom = `${uiZoom}%`;
}
function changeZoom(delta) { uiZoom += delta; applyZoom(); }
function resetZoom() { uiZoom = 100; applyZoom(); }
function t(key) { return I18N[lang][key] || ''; }
function itemTitle(item) { return lang === 'zh' ? item.cn : item.en; }
function bilingualItemName(item) {
  if (item.cn && item.en && item.cn !== item.en) return `${item.cn} / ${item.en}`;
  return item.cn || item.en || '';
}
function optText(obj) { return typeof obj === 'string' ? obj : (lang === 'zh' ? obj.zh : obj.en); }

function formatRedeemAndRemark(item) {
  const parts = [];
  if (item.redeemed) parts.push(t('redeemedTag'));
  if (item.remark) {
    const cleanedRemark = String(item.remark)
      .split(/[,，]/)
      .map(s => s.trim())
      .filter(s => s && !/^兑换\s*Redeemed$/i.test(s) && !/^Stamp\s*Redeemed$/i.test(s));
    parts.push(...cleanedRemark);
  }
  return Array.from(new Set(parts));
}

function syncSettingsModalUI() {
  const isZh = lang === 'zh';
  const btnZh = document.getElementById('btn-lang-zh');
  const btnEn = document.getElementById('btn-lang-en');

  if (btnZh) {
    btnZh.classList.toggle('active', isZh);
    btnZh.style.setProperty('background', isZh ? '#0d6efd' : '#ffffff', 'important');
    btnZh.style.setProperty('color', isZh ? '#ffffff' : '#111827', 'important');
    btnZh.style.setProperty('border-color', isZh ? '#0d6efd' : '#d1d5db', 'important');
  }
  if (btnEn) {
    btnEn.classList.toggle('active', !isZh);
    btnEn.style.setProperty('background', !isZh ? '#0d6efd' : '#ffffff', 'important');
    btnEn.style.setProperty('color', !isZh ? '#ffffff' : '#111827', 'important');
    btnEn.style.setProperty('border-color', !isZh ? '#0d6efd' : '#d1d5db', 'important');
  }

  const zoomValEl = document.getElementById('set-zoom-val');
  const zoomResetBtn = document.getElementById('btn-zoom-reset');
  if (zoomValEl) zoomValEl.textContent = `${uiZoom}%`;
  if (zoomResetBtn) {
    const isNotDefaultZoom = Number(uiZoom) !== 100;
    zoomResetBtn.classList.toggle('active', isNotDefaultZoom);
    zoomResetBtn.style.setProperty('background', isNotDefaultZoom ? '#0d6efd' : '#ffffff', 'important');
    zoomResetBtn.style.setProperty('color', isNotDefaultZoom ? '#ffffff' : '#111827', 'important');
    zoomResetBtn.style.setProperty('border-color', isNotDefaultZoom ? '#0d6efd' : '#d1d5db', 'important');
  }
}

function compressImageFile(file, callback) {
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const maxDim = 640;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.78));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

  const price = parseFloat(document.getElementById('new-dish-price').value);
  let code = document.getElementById('new-dish-code').value.trim().toUpperCase();
  if ((!cn && !en) || isNaN(price) || price < 0) {
    showAlert(lang === 'zh' ? '请填写名称与有效价格！' : 'Please enter name and valid price.');
    return;
  }
  const all = getMergedMenu();
  if (!code) {
    const prefix = cat === '饮料' ? 'D' : (cat === '甜品' ? 'A' : (cat === '小食' ? 'SD' : 'M'));
    let n = 100;
    while (all.some(x => x.code === `${prefix}${n}`)) n++;
    code = `${prefix}${n}`;
  } else if (all.some(x => x.code === code)) {
    showAlert(lang === 'zh' ? `编号 ${code} 已存在！` : `Code ${code} already exists.`);
    return;
  }
  extraMenuItems.push({ code, cat, cn: cn || en, en: en || cn, price, img: newDishPhotoDataUrl || '', isCustomDish: true });
  localStorage.setItem('rainbow_extra_menu_items', JSON.stringify(extraMenuItems)); invalidateMenuCache();
  broadcastMenuUpdate();
  document.getElementById('new-dish-code').value = '';

function importMenuSyncFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.overrides) {
        customMenuOverrides = { ...customMenuOverrides, ...data.overrides };
        localStorage.setItem('rainbow_menu_overrides', JSON.stringify(customMenuOverrides)); invalidateMenuCache();
      }
      if (Array.isArray(data.extraItems)) {
        const map = new Map(extraMenuItems.map(x => [x.code, x]));
        data.extraItems.forEach(x => map.set(x.code, x));
        extraMenuItems = Array.from(map.values());
        localStorage.setItem('rainbow_extra_menu_items', JSON.stringify(extraMenuItems)); invalidateMenuCache();
      }
      broadcastMenuUpdate(); renderMenu(); renderMenuManager();
      showAlert(lang === 'zh' ? '同步包导入成功！' : 'Imported!');
    } catch (err) {
      showAlert(lang === 'zh' ? '同步文件格式错误！' : 'Invalid file.');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function startClock() {
  const tick = () => {
    const d = new Date();
    const clockEl = document.getElementById('clock-text');
    if (!clockEl) return;
    const dayStr = String(d.getDate()).padStart(2, '0');
    const monStr = MONTHS_SHORT[d.getMonth()];
    let hr = d.getHours();
    const min = String(d.getMinutes()).padStart(2, '0');
    const sec = String(d.getSeconds()).padStart(2, '0');
    const ampm = hr >= 12 ? 'PM' : 'AM';
    hr = hr % 12;
    if (hr === 0) hr = 12;
    clockEl.textContent = `${dayStr}-${monStr}-${d.getFullYear()} ${String(hr).padStart(2, '0')}:${min}:${sec} ${ampm}`;
  };
  tick();
  setInterval(tick, 1000);
}

    if (item.noodleOptions) subNotes.push(optText(item.noodleOptions[parseInt(document.querySelector('input[name="noodleOpt"]:checked').value, 10)]));
    if (item.singleScoopOptions) { const c = item.singleScoopOptions[parseInt(document.querySelector('input[name="scoopOpt"]:checked').value, 10)]; finalPrice = c.price; subNotes.push(lang === 'zh' ? c.zh : c.en); }
    if (item.flavorOptions) { const c = item.flavorOptions[parseInt(document.querySelector('input[name="flavorOpt"]:checked').value, 10)]; finalPrice += c.extra; subNotes.push(lang === 'zh' ? c.zh : c.en); }
    if (item.marketPrice) finalPrice = parseFloat(document.getElementById('opt-market-price').value) || 0;
    if (item.noIcePrice) { const v = document.querySelector('input[name="iceOpt"]:checked').value; if (v === 'noice') { finalPrice = item.noIcePrice; subNotes.push(t('noIceLabel')); } else subNotes.push(t('iceLabel')); }
    if (item.sauces) subNotes.push(optText(item.sauces[parseInt(document.querySelector('input[name="sauceOpt"]:checked').value, 10)]));
    if (item.addon && document.getElementById('opt-addon').checked) { finalPrice += item.addon.price; subNotes.push(optText(item.addon)); }
    addToCart(item, finalPrice, subNotes.join(', '));
    closeModal('option-modal');
  };
  document.getElementById('option-modal').classList.add('show');
}
function openCustomItemModal() {

  document.getElementById('custom-item-price').value = '';
  document.getElementById('custom-item-modal').classList.add('show');
}
function addCustomItemToCart() {
  const name = document.getElementById('custom-item-name').value.trim();

  if (!name || isNaN(price) || price <= 0) return;
  cart.push({ code: 'CUSTOM', cat: '自定', cn: name, en: name, basePrice: price, qty: 1, spec: '', extraRice: 0, extraNoodle: 0, eggCount: 0, sausageCount: 0, packFee: 0, mustPackFee: false, redeemed: false, remark: '' });
  closeModal('custom-item-modal'); renderCart();
}
function addToCart(item, unitPrice, spec) {
  const autoPack = (item.mustPackFee && isTakeawayMode()) ? 0.5 : 0;
  cart.push({ code: item.code, cat: item.cat, cn: item.cn, en: item.en, basePrice: unitPrice, qty: 1, spec, extraRice: 0, extraNoodle: 0, eggCount: 0, sausageCount: 0, packFee: autoPack, mustPackFee: !!item.mustPackFee, redeemed: false, remark: '' });
  renderCart();
}
function getItemUnitExtra(item) {
  let extra = 0;
  if (item.extraRice) extra += (item.code === 'R1' ? 2.5 : (item.cat === '西餐' ? 2.5 : 4));
  if (item.extraNoodle) extra += 4;
  if (item.eggCount) extra += item.eggCount * 1.5;
  if (item.sausageCount) extra += item.sausageCount * 1.5;
  extra += (item.packFee || 0);
  return extra;
}
function getCartItemRowTotal(item) {
  if (item.redeemed) return 0;
  return (item.basePrice + getItemUnitExtra(item)) * item.qty;
}
function renderCart() {
  const sendBtn = document.getElementById('btn-send-order');
  if (sendBtn) sendBtn.textContent = editingActiveOrderIdx >= 0 ? t('updateOrderBtn') : t('sendOrderBtn');
  const listEl = document.getElementById('cart-list');
  if (cart.length === 0) {
    listEl.innerHTML = `<div style="text-align:center;color:var(--muted);margin-top:40px;">${lang === 'zh' ? '点击左侧菜品加入订单' : 'Tap menu items to add'}</div>`;
    document.getElementById('cart-total').textContent = 'RM 0.00';
    return;
  }
  let grandTotal = 0;
  listEl.innerHTML = cart.map((item, idx) => {
    const rowTotal = getCartItemRowTotal(item);
    grandTotal += rowTotal;
    const riceFee = item.code === 'R1' ? 2.5 : (item.cat === '西餐' ? 2.5 : 4);
    const extrasText = [
      item.spec,
      item.extraRice ? `${lang === 'zh' ? '加饭' : 'Rice'} +RM${riceFee.toFixed(2)}` : '',
      item.extraNoodle ? `${lang === 'zh' ? '加面' : 'Noodle'} +RM4.00` : '',
      item.eggCount ? `${lang === 'zh' ? '太阳蛋' : 'Egg'} ×${item.eggCount}` : '',
      item.sausageCount ? `${lang === 'zh' ? '香肠' : 'Sausage'} ×${item.sausageCount}` : '',
      item.packFee > 0 ? `${t('takeaway')} +RM${item.packFee.toFixed(2)}` : ''
    ].filter(Boolean);
    const notes = formatRedeemAndRemark(item).filter(x => x !== t('redeemedTag'));
    return `
      <div class="cart-item">
        <div class="cart-item-top">
          <div>
            <div class="cart-item-name">${item.code} ${itemTitle(item)}</div>
            ${extrasText.length ? `<div class="cart-item-sub">${extrasText.join(' · ')}</div>` : ''}
            ${item.redeemed ? `<div class="redeem-badge">${t('redeemedTag')}</div>` : ''}
            ${notes.length ? `<div class="cart-item-sub" style="color:var(--primary);">${notes.join(' · ')}</div>` : ''}
          </div>
          <div style="font-weight:700;color:${item.redeemed ? '#059669' : 'var(--price-color)'};">RM ${rowTotal.toFixed(2)}</div>
        </div>
        <div class="cart-item-actions">
          <div class="qty-box">
            <button class="qty-btn" onclick="triggerHaptic(); changeQty(${idx}, -1);">-</button>
            <span style="font-weight:700;">${item.qty}</span>
            <button class="qty-btn" onclick="triggerHaptic(); changeQty(${idx}, 1);">+</button>
          </div>
          ${['西餐', '饭类'].includes(item.cat) ? `<button class="mini-btn ${item.extraRice ? 'active' : ''}" onclick="triggerHaptic(); toggleRice(${idx});">+${lang === 'zh' ? '加饭' : 'Rice'} RM${riceFee.toFixed(2)}</button>` : ''}
          ${item.cat === '面类' ? `<button class="mini-btn ${item.extraNoodle ? 'active' : ''}" onclick="triggerHaptic(); toggleNoodle(${idx});">+${lang === 'zh' ? '加面' : 'Noodle'} RM4</button>` : ''}
          ${item.cat === '西餐' ? `<button class="mini-btn ${item.eggCount ? 'active' : ''}" onclick="triggerHaptic(); addEgg(${idx});">+${lang === 'zh' ? '太阳蛋' : 'Egg'} RM1.5</button><button class="mini-btn ${item.sausageCount ? 'active' : ''}" onclick="triggerHaptic(); addSausage(${idx});">+${lang === 'zh' ? '香肠' : 'Sausage'} RM1.5</button>` : ''}
          ${item.cat === '饮料' && !item.mustPackFee ? `<button class="mini-btn ${item.packFee > 0 ? 'active' : ''}" onclick="triggerHaptic(); togglePackFee(${idx});">+RM0.50 ${t('takeaway')}</button>` : ''}
          <button class="mini-btn ${item.redeemed || item.remark ? 'active' : ''}" onclick="triggerHaptic(); openRemarkModal(${idx});">${lang === 'zh' ? '备注' : 'Note'}</button>
          <button class="mini-btn del" onclick="triggerHaptic(); removeCartItem(${idx});">${t('delBtn')}</button>
        </div>
      </div>
    `;
  }).join('');
  document.getElementById('cart-total').textContent = `RM ${grandTotal.toFixed(2)}`;
}
function changeQty(idx, delta) { cart[idx].qty += delta; if (cart[idx].qty <= 0) cart.splice(idx, 1); renderCart(); }
function toggleRice(idx) { cart[idx].extraRice = cart[idx].extraRice ? 0 : 1; renderCart(); }
function toggleNoodle(idx) { cart[idx].extraNoodle = cart[idx].extraNoodle ? 0 : 1; renderCart(); }
function addEgg(idx) { cart[idx].eggCount = (cart[idx].eggCount || 0) + 1; renderCart(); }
function addSausage(idx) { cart[idx].sausageCount = (cart[idx].sausageCount || 0) + 1; renderCart(); }
function togglePackFee(idx) { cart[idx].packFee = cart[idx].packFee > 0 ? 0 : 0.5; renderCart(); }
function removeCartItem(idx) { cart.splice(idx, 1); renderCart(); }
function clearCart() { cart = []; editingActiveOrderIdx = -1; editingOrderBizDate = null; renderCart(); }

function openRemarkModal(idx) {
  editingRemarkIndex = idx;
  const item = cart[idx];
  const existing = (item && item.remark) ? String(item.remark) : '';
  const sepRegex = /[,，、·]+/;
  const rawParts = existing
    .split(sepRegex)
    .map(s => s.trim())
    .filter(Boolean);

  selectedRemarkTags = [];
  if (item && item.redeemed) {
    selectedRemarkTags.push(lang === 'zh' ? '兑换 Redeemed' : 'Stamp Redeemed');
  }

  const presetLabels = new Set([
    ...(typeof REMARK_PRESETS !== 'undefined' ? REMARK_PRESETS.flatMap(t => [t.zh, t.en]) : []),
    '打包', 'Takeaway', '少冰', 'Less Ice', '去冰', 'No Ice',
    '少甜', 'Less Sweet', '走甜', 'No Sweet', '不辣', 'No Spicy',
    '加辣', 'Extra Spicy', '分开酱汁', 'Sauce Separate'
  ]);

  const customParts = [];
  rawParts.forEach(part => {
    if (part === '兑换 Redeemed' || part === 'Stamp Redeemed') {
      if (!selectedRemarkTags.includes(part)) selectedRemarkTags.push(part);
    } else if (presetLabels.has(part)) {
      if (!selectedRemarkTags.includes(part)) selectedRemarkTags.push(part);
    } else {
      customParts.push(part);
    }
  });

  document.getElementById('remark-custom').value = customParts.join(', ');
  renderRemarkTags();
  document.getElementById('remark-modal').classList.add('show');
}

function isDrinkCartItem(item) {
  if (!item) return false;
  const menuMeta = typeof getMenuItemByCode === 'function' ? getMenuItemByCode(item.code) : null;
  const cat = String(item.cat || menuMeta?.cat || '').trim().toLowerCase();
  return cat === '饮料' || cat === 'drinks' || cat === 'drink' || cat === 'beverage' || cat === 'beverages';
}

function hasPaidDrinkSpec(item) {
  if (!item) return false;
  if (item.hasPaidVariants === true || item.hasIcePricing === true) return true;
  const menuMeta = typeof getMenuItemByCode === 'function' ? getMenuItemByCode(item.code) : null;
  if (menuMeta && (typeof menuMeta.noIcePrice === 'number' || (Array.isArray(menuMeta.options) && menuMeta.options.length > 1) || (Array.isArray(menuMeta.variants) && menuMeta.variants.length > 1))) {
    return true;
  }
  const specText = String(item.spec || '');
  return /冰|去冰|no ice|less ice/i.test(specText);
}

function getRemarkTagObjectsForCartItem(item) {
  const catalog = {
    redeem: { zh: '兑换 Redeemed', en: 'Stamp Redeemed' },
    takeaway: { zh: '打包', en: 'Takeaway' },
    lessSweet: { zh: '少甜', en: 'Less Sweet' },
    noSweet: { zh: '走甜', en: 'No Sugar' },
    lessIce: { zh: '少冰', en: 'Less Ice' },
    noIce: { zh: '去冰', en: 'No Ice' },
    noSpicy: { zh: '不辣', en: 'No Spicy' },
    extraSpicy: { zh: '加辣', en: 'Extra Spicy' },
    sauceSeparate: { zh: '分开酱汁', en: 'Sauce Separate' }
  };

  if (!isDrinkCartItem(item)) {
    // 1. 普通食物：不需要少冰、去冰、少甜、走甜
    return ['takeaway', 'redeem', 'noSpicy', 'extraSpicy', 'sauceSeparate']
      .map(k => catalog[k]).filter(Boolean);
  }

  const specStr = String(item?.spec || '').trim();
  const isSelectedNoIce = /去冰|no\s*ice/i.test(specStr);
  const isSelectedIceOnly = !isSelectedNoIce && /(^|[,，\s])(冰|ice)([,，\s]|$)/i.test(specStr);

  let keys;
  if (hasPaidDrinkSpec(item)) {
    // 3. 饮料分类 — 已有收费规格选项
    keys = ['redeem', 'takeaway', 'lessIce', 'noIce', 'lessSweet', 'noSweet'];
  } else {
    // 2. 固定价格的饮料分类
    keys = ['redeem', 'takeaway', 'lessSweet', 'noSweet', 'lessIce', 'noIce'];
  }

  // 防矛盾过滤：
  // - 已经选了“去冰”规格 -> 不再显示“去冰”和“少冰”
  // - 已经选了“冰”规格 -> 不再显示“去冰”
  if (isSelectedNoIce) {
    keys = keys.filter(k => k !== 'noIce' && k !== 'lessIce');
  } else if (isSelectedIceOnly) {
    keys = keys.filter(k => k !== 'noIce');
  }

  return keys.map(k => catalog[k]).filter(Boolean);
}

function renderRemarkTags() {
  const wrap = document.getElementById('remark-tags');
  if (!wrap) return;
  const isZh = lang === 'zh';
  const currentItem = (typeof editingRemarkIndex === 'number' && editingRemarkIndex >= 0 && Array.isArray(cart))
    ? cart[editingRemarkIndex]
    : null;

  const tagList = getRemarkTagObjectsForCartItem(currentItem);

  wrap.innerHTML = tagList.map(tagObj => {
    const label = isZh ? tagObj.zh : tagObj.en;
    const altLabel = isZh ? tagObj.en : tagObj.zh;
    const isActive = selectedRemarkTags.includes(label) || (altLabel && selectedRemarkTags.includes(altLabel));
    const safeLabel = label.replace(/'/g, "\\'");
    const activeStyle = isActive
      ? 'background:#0d6efd;color:#ffffff;border-color:#0d6efd;'
      : 'background:#ffffff;color:#111827;border-color:#d1d5db;';
    return `<button type="button" class="tag-btn ${isActive ? 'active' : ''}" style="${activeStyle}" onclick="if(typeof triggerHaptic==='function')triggerHaptic(); toggleRemarkTag('${safeLabel}');">${label}</button>`;
  }).join('');
}

function toggleRemarkTag(tag) {
  const idx = selectedRemarkTags.indexOf(tag);
  if (idx >= 0) {
    selectedRemarkTags.splice(idx, 1);
  } else {
    selectedRemarkTags.push(tag);
  }
  renderRemarkTags();
}

function saveRemark() {
  const custom = document.getElementById('remark-custom').value.trim();
  const sep = lang === 'zh' ? '，' : ', ';
  const isRedeem = selectedRemarkTags.some(x => x.includes('兑换') || x.toLowerCase().includes('redeemed'));
  const otherTags = selectedRemarkTags.filter(x => !x.includes('兑换') && !x.toLowerCase().includes('redeemed'));
  const combined = [...otherTags, ...(custom ? [custom] : [])].join(sep);

  if (editingRemarkIndex >= 0 && cart[editingRemarkIndex]) {
    const item = cart[editingRemarkIndex];
    item.redeemed = isRedeem;
    item.remark = combined;

    const hasPack = combined.includes('打包') || combined.toLowerCase().includes('takeaway');
    const catText = `${item.cat || ''} ${item.category || ''} ${item.cn || ''} ${item.en || ''}`.toLowerCase();
    const isDessertOrShake =
      catText.includes('甜品') ||
      catText.includes('dessert') ||
      catText.includes('奶昔') ||
      catText.includes('milkshake') ||
      catText.includes('milk shake');

    item.packFee = (hasPack && isDessertOrShake) ? 0.5 : 0;
  }

  closeModal('remark-modal');
  renderCart();
}
function closeModal(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('show');
}
function cancelCashModal() {
  pendingCashOrderIdx = -1;
  document.getElementById('cash-given-input').value = '';

}

function submitOrder() {
  if (selectedTables.length === 0 || cart.length === 0) {
    showAlert(lang === 'zh' ? '请先选择桌号并加入菜品！' : 'Select table and items first.');
    return;
  }
  let total = 0;
  const itemsCopy = cart.map(item => {
    const sub = getCartItemRowTotal(item);
    total += sub;
    return { ...item, subTotal: sub };
  });
  const now = new Date();

  const goToPosPage = () => {
    const posBtn = document.getElementById('tab-pos');
    if (typeof switchPage === 'function') {
      switchPage('pos', posBtn);
    }
  };

  if (editingActiveOrderIdx >= 0 && activeOrders[editingActiveOrderIdx]) {
    const oldOrd = activeOrders[editingActiveOrderIdx];
    activeOrders[editingActiveOrderIdx] = {
      ...oldOrd,
      table: selectedTables.includes('TAKEAWAY') ? '打包' : selectedTables.join(' + '),
      rawTables: [...selectedTables],
      updatedAt: formatSpaceDate(now),
      items: itemsCopy,
      total
    };
    editingActiveOrderIdx = -1;
    localStorage.setItem('rainbow_active_orders', JSON.stringify(activeOrders));
    cart = [];
    selectedTables = [];
    renderTables();
    renderCart();
    renderPOS();
    goToPosPage();

  }

  const targetBizDate = editingOrderBizDate || selectedBizDate || getDefaultBusinessDateStr(now);
  activeOrders.unshift({
    id: 'ORD-' + Date.now().toString().slice(-5),
    table: selectedTables.includes('TAKEAWAY') ? '打包' : selectedTables.join(' + '),
    rawTables: [...selectedTables],
    createdAt: now.getTime(),
    dateTimeStr: formatSpaceDate(targetBizDate),
    bizDate: targetBizDate,
    items: itemsCopy,
    total
  });
  editingOrderBizDate = null;
  localStorage.setItem('rainbow_active_orders', JSON.stringify(activeOrders));
  cart = [];
  selectedTables = [];
  renderTables();
  renderCart();
  renderPOS();
  goToPosPage();
}

function editActiveOrderInCart(idx) {
  const ord = activeOrders[idx];
  if (!ord) return;
  editingActiveOrderIdx = idx;
  editingOrderBizDate = ord.bizDate || null;
  selectedTables = Array.isArray(ord.rawTables) && ord.rawTables.length
    ? [...ord.rawTables]
    : (ord.table === '打包' ? ['TAKEAWAY'] : ord.table.split('+').map(s => s.trim().replace('号', '').trim()).filter(Boolean));

function displayStoredTable(tableStr) {

function deleteActiveOrder(idx) {
  const ord = activeOrders[idx];
  showConfirm(lang === 'zh' ? `确定删除未结账桌单 ${displayStoredTable(ord.table)}？` : `Delete active order?`, () => {
    activeOrders.splice(idx, 1);

  });
}

function openCashModal(idx) {
  pendingCashOrderIdx = idx;
  const ord = activeOrders[idx];
  document.getElementById('cash-table-val').textContent = displayStoredTable(ord.table);
  document.getElementById('cash-due-val').textContent = `RM ${Number(ord.total || 0).toFixed(2)}`;
  const input = document.getElementById('cash-given-input');
  input.value = '';
  updateCashChangePreview();
  document.getElementById('cash-modal').classList.add('show');
  setTimeout(() => input.focus(), 80);
}
function updateCashChangePreview() {
  if (pendingCashOrderIdx < 0 || !activeOrders[pendingCashOrderIdx]) return;
  const due = Number(activeOrders[pendingCashOrderIdx].total || 0);
  const rawVal = document.getElementById('cash-given-input').value.trim();
  const preview = document.getElementById('cash-change-preview');
  if (rawVal === '') {
    preview.style.color = 'var(--muted)';
    preview.textContent = lang === 'zh' ? '找零 Change：RM 0.00' : 'Change: RM 0.00';
    return;
  }
  const given = parseFloat(rawVal);
  if (isNaN(given) || given < due) {
    preview.style.color = '#ef4444';
    preview.textContent = lang === 'zh' ? `收现不足（需至少 RM ${due.toFixed(2)}）` : `Insufficient (Min RM ${due.toFixed(2)})`;
    return;
  }
  preview.style.color = 'var(--price-color)';
  preview.textContent = `Change: RM ${(given - due).toFixed(2)}`;
}
function confirmExactCash() {
  if (pendingCashOrderIdx < 0) return;
  const idx = pendingCashOrderIdx;
  const due = Number(activeOrders[idx].total || 0);
  pendingCashOrderIdx = -1;
  closeModal('cash-modal');
  settleOrder(idx, 'Cash', due, 0);
}
function confirmCustomCash() {
  if (pendingCashOrderIdx < 0) return;
  const idx = pendingCashOrderIdx;
  const due = Number(activeOrders[idx].total || 0);
  const rawVal = document.getElementById('cash-given-input').value.trim();
  if (rawVal === '') { confirmExactCash(); return; }
  const given = parseFloat(rawVal);
  if (isNaN(given) || given < due) return;
  pendingCashOrderIdx = -1;
  closeModal('cash-modal');
  settleOrder(idx, 'Cash', given, given - due);
}
function settleOrder(idx, method, cashReceived = null, cashChange = null) {
  if (idx < 0 || !activeOrders[idx]) return;
  const ord = activeOrders[idx];
  const due = Number(ord.total || 0);
  const now = new Date();
  const bizDay = ord.bizDate || selectedBizDate || getDefaultBusinessDateStr(now);
  const paidObj = {
    ...ord,
    payMethod: method,
    cashReceived: method === 'Cash' ? (cashReceived !== null ? cashReceived : due) : null,
    cashChange: method === 'Cash' ? (cashChange !== null ? cashChange : 0) : null,
    paidAt: formatSpaceDate(now),
    dateStr: bizDay,
    monthStr: bizDay.slice(0, 7),
    yearStr: bizDay.slice(0, 4)
  };
  completedOrders.unshift(paidObj);
  activeOrders.splice(idx, 1);
  localStorage.setItem('rainbow_active_orders', JSON.stringify(activeOrders));
  localStorage.setItem('rainbow_completed_orders', JSON.stringify(completedOrders));
  renderPOS(); renderAccounting();
  showConfirm(lang === 'zh' ? `${displayStoredTable(ord.table)} 已结账（RM ${due.toFixed(2)}），是否打印收据？` : `Paid RM ${due.toFixed(2)}. Print receipt?`, () => {

  });
}

function printReceiptData(ord, statusLabel = '') {
  document.body.classList.remove('print-a4');
  const area = document.getElementById('print-area');
  const due = Number(ord.total || 0);
  const receiptDateStr = formatSpaceDate(ord.dateStr || ord.paidAt || ord.dateTimeStr || new Date());
  const earnedStamps = Math.floor(due / 25);

  const rawTbl = String(ord.table || '').trim();
  let tableEn = '-';
  if (rawTbl === '打包' || rawTbl.toUpperCase() === 'TAKEAWAY' || rawTbl.includes('Takeaway')) {
    tableEn = 'Takeaway';
  } else if (rawTbl) {
    tableEn = rawTbl
      .split('+')
      .map(s => s.replace(/号/g, '').replace(/Table/gi, '').trim())
      .filter(Boolean)
      .map(num => `Table ${num}`)
      .join(' + ');
  }

  const hasCashBreakdown =
    ord.payMethod === 'Cash' &&
    ord.cashReceived !== undefined &&
    ord.cashReceived !== null &&
    !isNaN(Number(ord.cashReceived));
  const cashRecVal = hasCashBreakdown ? Number(ord.cashReceived) : 0;
  const cashChgVal = hasCashBreakdown
    ? (ord.cashChange !== undefined && ord.cashChange !== null && !isNaN(Number(ord.cashChange))
        ? Number(ord.cashChange)
        : Math.max(0, cashRecVal - due))
    : 0;

  const itemsHtml = (ord.items || []).map(i => {
    const amt = (i.redeemed ? 0 : Number(i.subTotal || 0)).toFixed(2);
    const noteParts = (typeof formatRedeemAndRemark === 'function') ? formatRedeemAndRemark(i) : [];
    const subLine = [i.spec, ...noteParts].filter(Boolean).join(' · ');
    return `
      <div style="margin-bottom:5px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">
          <span style="flex:1;min-width:0;word-break:break-word;text-align:left;">${i.code} ${bilingualItemName(i)} x${i.qty}</span>
          <span style="flex-shrink:0;white-space:nowrap;text-align:right;font-weight:600;">RM ${amt}</span>
        </div>
        ${subLine ? `<div style="font-size:8.5px;color:#222;padding-left:4px;margin-top:1px;">[${subLine}]</div>` : ''}
      </div>
    `;
  }).join('');

  const cashBreakdownHtml = hasCashBreakdown ? `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:9.5px;margin-top:3px;">
      <span>Cash Received:</span>
      <span style="font-weight:600;">RM ${cashRecVal.toFixed(2)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;font-weight:700;margin-top:2px;">
      <span>Change:</span>
      <span>RM ${cashChgVal.toFixed(2)}</span>
    </div>
  ` : '';

  area.innerHTML = `
    <div style="width:54mm;margin:0;padding:0;font-family:-apple-system,'PingFang SC',monospace;font-size:10px;line-height:1.35;color:#000;">
      <div style="text-align:center;font-weight:800;font-size:11.5px;">Rainbow Ice Parlour & Coffee House</div>
      <div style="text-align:center;font-size:9px;">Since 1991</div>
      <div style="border-top:1px dashed #000;margin:4px 0;"></div>
      <div style="font-size:9px;">Order: ${ord.id}${statusLabel ? ` (${statusLabel})` : ''}</div>
      <div style="font-size:9px;">Table: ${tableEn}</div>
      <div style="font-size:9px;">Date: ${receiptDateStr}</div>
      ${ord.payMethod ? `<div style="font-size:9px;">Pay: ${ord.payMethod}</div>` : ''}
      <div style="border-top:1px dashed #000;margin:4px 0;"></div>
      ${itemsHtml}
      <div style="border-top:1px dashed #000;margin:4px 0;"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;font-size:11px;">
        <span style="white-space:nowrap;">TOTAL (NETT):</span>
        <span style="white-space:nowrap;text-align:right;">RM ${due.toFixed(2)}</span>
      </div>
      ${cashBreakdownHtml}
      <div style="border-top:1px dashed #000;margin:5px 0;"></div>
      <div style="font-size:9px;line-height:1.4;text-align:center;">
        <div><b>RM 25 = 1 Stamp</b>（集满印花可兑换指定美食 / Collect stamps to redeem food）</div>
        ${earnedStamps > 0 ? `<div style="font-weight:700;margin-top:2px;">★ 本单可盖 / Earned: ${earnedStamps} Stamp(s) ★</div>` : ''}
        <div style="margin-top:3px;">外卖 / 预订请电联 Order / Call: <b>016-9326173 / 016-9402647</b></div>
        <div style="margin-top:2px;font-weight:700;">谢谢惠顾 · Thank You!</div>
      </div>
    </div>
  `;
  area.style.display = 'block';
  window.print();
  setTimeout(() => { area.style.display = 'none'; }, 350);
}

function buildCompactClosingA4Html(reportTitleEn, periodLabelEn, dayOrders, dayExpenses) {
  const revTotal = dayOrders.reduce((s, x) => s + Number(x.total || 0), 0);
  const cashTotal = dayOrders.filter(x => x.payMethod === 'Cash').reduce((s, x) => s + Number(x.total || 0), 0);
  const qrTotal = dayOrders.filter(x => x.payMethod === 'DuitNow QR').reduce((s, x) => s + Number(x.total || 0), 0);
  const expTotal = dayExpenses.reduce((s, x) => s + Number(x.amount || 0), 0);
  const netProfit = revTotal - expTotal;
  const printedStr = formatPrinted12h(new Date());

  const formatTableEn = (tbl) => {
    if (!tbl) return '-';
    if (tbl === '打包' || tbl.includes('Takeaway')) return 'Takeaway';
    return tbl.split('+').map(s => `Table ${s.trim().replace('号', '').replace('Table', '').trim()}`).join(' + ');
  };

  const combinedRows = [];
  dayOrders.forEach(o => {
    combinedRows.push({
      type: 'Revenue', code: o.id,
      desc: `${formatTableEn(o.table)} - ${o.payMethod || '-'}`,
      date: formatDashDate(o.dateStr || o.paidAt || o.dateTimeStr || new Date()),
      amountStr: `+RM ${Number(o.total || 0).toFixed(2)}`
    });
  });
  dayExpenses.forEach(e => {
    combinedRows.push({
      type: 'Expense', code: e.id,
      desc: translateExpenseToEnglish(e),
      date: formatDashDate(e.dateStr || e.dateTimeStr || new Date()),
      amountStr: `-RM ${Number(e.amount || 0).toFixed(2)}`
    });
  });

  const ROWS_PER_PAGE = 26;
  const chunks = [];
  if (combinedRows.length === 0) chunks.push([]);
  else for (let i = 0; i < combinedRows.length; i += ROWS_PER_PAGE) chunks.push(combinedRows.slice(i, i + ROWS_PER_PAGE));

  return chunks.map((chunk, pageIdx) => {
    const startNo = pageIdx * ROWS_PER_PAGE;
    const rowsHtml = chunk.length
      ? chunk.map((r, i) => `
        <tr>
          <td>${startNo + i + 1}</td>
          <td>${r.type}</td>
          <td>${r.code}</td>
          <td>${r.desc}</td>
          <td>${r.date}</td>
          <td style="text-align:right;font-weight:700;">${r.amountStr}</td>
        </tr>
      `).join('')
      : `<tr><td colspan="6" style="text-align:center;color:#555;padding:6px;">No records</td></tr>`;

    return `
      <div class="a4-page-block">
        <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.2pt solid #000;padding-bottom:3px;margin-bottom:6px;">
          <div style="font-size:10.5pt;font-weight:700;">Rainbow Ice Parlour & Coffee House Since 1991 · ${reportTitleEn}</div>
          <div style="font-size:8.5pt;font-weight:600;">${periodLabelEn} · Page ${pageIdx + 1}/${chunks.length}</div>
        </div>

        <table class="a4-summary-table">
          <tr>
            <td><b>Revenue:</b> RM ${revTotal.toFixed(2)}</td>
            <td><b>Cash:</b> RM ${cashTotal.toFixed(2)}</td>
            <td><b>QR:</b> RM ${qrTotal.toFixed(2)}</td>
            <td><b>Expense:</b> RM ${expTotal.toFixed(2)}</td>
            <td><b>Net Profit:</b> <b>RM ${netProfit.toFixed(2)}</b></td>
          </tr>
        </table>

        <table class="a4-compact-table">
          <thead>
            <tr>
              <th style="width:28px;">#</th>
              <th style="width:66px;">Type</th>
              <th style="width:78px;">Ref No.</th>
              <th>Details / Item Purchased</th>
              <th style="width:88px;">Date</th>
              <th style="width:82px;text-align:right;">Amount</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>

        <div class="a4-sign-footer">
          <div class="a4-sign-row">
            <div class="a4-sign-box">
              <div><b>Prepared By (Sign & Date):</b></div>
              <div class="a4-sign-line"></div>
            </div>
            <div class="a4-sign-box">
              <div><b>Verified By (Sign & Date):</b></div>
              <div class="a4-sign-line"></div>
            </div>
            <div class="a4-sign-box">
              <div><b>Approved By (Sign & Date):</b></div>
              <div class="a4-sign-line"></div>
            </div>
          </div>
          <div>
            <div><b>Remarks / Written Declaration (写明说明 / 调整备注):</b></div>
            <div class="a4-notes-box">
              <div class="a4-write-line"></div>
              <div class="a4-write-line"></div>
              <div class="a4-write-line" style="border-bottom:none;"></div>
            </div>
          </div>
          <div style="margin-top:8px;text-align:right;font-size:8pt;color:#333;">Printed: ${printedStr}</div>
        </div>
      </div>
    `;
  }).join('');
}
